services:

    monitoring-center-db:
        container_name: ${DBServiceName}
        image: ${DB_REGISTRY_IMAGE}
        restart: always
        ports:
            - "${DB_BIND_ADDRESS}:5432"
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        networks:
            - minux_network
        volumes:
            - monitoring-center-db:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    rigs-api:
        container_name: ${ServiceName}
        image: ${APP_REGISTRY_IMAGE}
        restart: always
        environment:
            - ASPNETCORE_URLS=http://+:80
        env_file:
            - ${COMMON_ENV_FILE}
            - ${PROJECT_ENV_FILE}
        networks:
            - minux_network
        depends_on:
            monitoring-center-db:
              condition: service_healthy

volumes:
  monitoring-center-db:

networks:
  minux_network:
    name: minux_network
    external: true