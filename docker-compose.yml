name: monitoring_center
services:

    rigs_api:
        container_name: rigs-api
        image: rigs-api
        build:
            context: .
            dockerfile: ./src/MNX.MonitoringCenter.RigsApi.Service/Dockerfile
            args:
                - nuget_server=http://77.37.200.24:5554/v3/index.json
        restart: unless-stopped
        ports:
             - "8001:8080"
        environment:
             - applicationUrl=http://77.37.200.24:8001
             - ServiceName=rigs-api
             - ConsulUri=http://77.37.200.24:8500

    monitoring_center_db:
        container_name: monitoring_center_db
        image: postgres:15-alpine
        restart: always

        ports:
            - 6543:5432

        volumes:
            - ./db/:/docker-entrypoint-initdb.d

        environment:
            - POSTGRES_DB=monitoring_center
            - POSTGRES_USER=MinuxDbAdmin
            - POSTGRES_PASSWORD=MinuxDbAdmin
