name: monitoring_center
services:

    rigs_api:
        container_name: rigs_api
        image: rigs_api
        build:
            context: .
            dockerfile: ./src/MNX.MonitoringCenter.RigsApi.Service/Dockerfile
            args:
                - nuget_server=http://77.37.200.24:5554/v3/index.json
        restart: unless-stopped
        ports:
             - "8001:8080"
        environment:
             - applicationUrl=http://77.37.200.24:8001
             - ServiceName=rigs_api
             - ConsulUri=http://77.37.200.24:8500
